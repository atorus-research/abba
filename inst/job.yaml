kind: Job
apiVersion: batch/v1
metadata:
  name: XXX
  generateName: XXX
  namespace: rstudio
  labels:
    app.kubernetes.io/managed-by: Connect
  annotations:
    batch.kubernetes.io/job-tracking: ''
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  selector:
  template:
    metadata:
      generateName: XXX
      creationTimestamp: null
      labels:
        job-name: XXX
      annotations:
        # Not sure if these matter?
        USER_TAG_0: rstudio-r-script-job:~/eliJob.R
        name: eliJob.R
        service_ports: '[]'
        stdin: ''
        user: eli.miller
    spec:
      volumes:
        # I assume this will have to be set to the home directory of the service account
        - name: mount0
          nfs:
            server: 10.14.0.6
            path: /home/eli.miller
      containers:
        - name: rs-launcher-container
          image: atoruscontainers.azurecr.io/jammy-1.0.1-workbench
          command:
            - /bin/bash
          args:
            - '-c'
            # This will have to point to the proper program to execute
            - cd ~ && R --slave --no-save --no-restore -f ~/rmd-plus-k8s/test.R
          env:
            - name: HOME
              value: /home/eli.miller
          resources:
            limits:
              cpu: '1'
              memory: 512M
          volumeMounts:
            # This will need to be configured
            - name: mount0
              mountPath: /home/eli.miller
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          stdinOnce: true
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      shareProcessNamespace: true
      securityContext:
        # These will need to be autoset
        runAsUser: 1182601113
        runAsGroup: 1182600513
      schedulerName: default-scheduler
  completionMode: NonIndexed
  suspend: false
